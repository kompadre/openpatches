services:
  openpatches:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: openpatches
    restart: unless-stopped
    environment:
      - GOMAXPROCS=4
    volumes:
      - exports:/app/exports

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../index.html:/srv/index.html:ro
      - ../html/:/srv/html:ro
      - exports:/exports:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  exports:
  caddy_data:
  caddy_config:
