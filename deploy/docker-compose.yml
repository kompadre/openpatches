services:
  openpatches:
    build:
      context: ../deploy/app
      dockerfile: ../Dockerfile
    container_name: openpatches
    restart: unless-stopped
    environment:
      - GOMAXPROCS=4
    volumes:
      - exports:/app/exports
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../deploy/app/index.html:/srv/index.html:ro
      - exports:/exports:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  exports:
  caddy_data:
  caddy_config:
